:root{
  --bg:#eef1ef; --panel:#fff; --fg:#17211d; --muted:#5d6b65; --line:#d3dad6;

  --amber:#ffb020; --t-rapid:#4ade80; --t-local:#6cb6ff; --t-special:#ff8ad1; --ok:#39d98a; --bad:#ff5d5d;

  --num:"SF Mono","Roboto Mono",Consolas,"Noto Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b100e; --panel:#141b18; --fg:#e8eeeb; --muted:#93a39c; --line:#26302c; --board:#060908; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b100e; --panel:#141b18; --fg:#e8eeeb; --muted:#93a39c; --line:#26302c; --board:#060908; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--ui);padding-block:20px 40px;padding-inline:16px}
main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--panel);border:1px solid var(--line);border-bottom:6px solid var(--jl);padding:14px 18px}
.code{border:3px solid var(--jl);border-radius:6px;padding:2px 8px;font:700 15px/1.2 var(--num);text-align:center}
h1{margin:0;font-size:26px;letter-spacing:.12em}
.sub{color:var(--muted);font-size:13px}
.clock{margin-left:auto;font:600 26px var(--num);font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--amber);color:#201400}
.badge.live{background:var(--ok);color:#00210f}
#info{background:var(--panel);border:1px solid var(--line);padding:10px 14px}
#info b{margin-right:8px}
#info.trouble{border-color:var(--bad)}
#info.trouble b{color:var(--bad)}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.board.wide{grid-column:1/-1}
.board{display:flex;flex-direction:column}
.board:not(.wide) .rows{flex:1;display:grid;grid-auto-rows:1fr}
.row{align-content:start}
.row.leaving{opacity:0;transition:opacity .75s ease}
.board.wide .row{grid-template-columns:auto 1fr}
.board.wide .rows{display:grid;grid-template-columns:repeat(3,1fr);gap:0 28px}
@media (max-width:680px){.boards,.board.wide .rows{grid-template-columns:1fr}}
.board{background:var(--board);color:var(--board-fg);padding:14px;min-width:0}
.board h2{margin:0 0 8px;font-size:15px;color:var(--amber);letter-spacing:.06em}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;padding:9px 0;border-top:1px solid #26302c}
.time{font:600 22px var(--num);font-variant-numeric:tabular-nums}
.time s{color:var(--board-dim);font-size:14px;margin-right:6px}
.dest{font-size:18px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.dest small{display:block;font-size:12px;font-weight:400;color:var(--board-dim)}
.st{text-align:right;font-size:13px;white-space:nowrap}
.st .d{font-weight:700;color:var(--ok)}
.st .d.late{color:var(--bad)}
.st .d.unk{color:var(--board-dim)}
.st .in{display:block;color:var(--amber);font-family:var(--num)}
.xfer{grid-column:1/-1;font-size:13px;color:var(--board-dim);padding-left:2px}
.xfer b{color:var(--amber);font-family:var(--num);font-variant-numeric:tabular-nums}
.xfer .tt-Rapid{color:var(--t-rapid);font-weight:600}
.xfer .tt-Local{color:var(--t-local);font-weight:600}
.xfer .tt-SpecialRapid{color:var(--t-special);font-weight:600}
.xfer .late{color:var(--bad)}
.empty{color:var(--board-dim);padding:12px 0}
details{background:var(--panel);border:1px solid var(--line);padding:10px 14px}
summary{cursor:pointer;font-weight:700}
form{display:grid;gap:10px;margin-top:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);max-width:100%}
button{background:var(--jl);color:#00241c;font-weight:700;border:0;cursor:pointer;justify-self:start}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#msg{font-size:13px;color:var(--muted);margin:0}
#msg.err{color:var(--bad)}

.code2{display:flex;gap:6px}
.code.jj{border-color:var(--jj)}
:root{--jj:#00b261}
.dest .ln{display:inline-block;font-size:11px;font-weight:700;border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:2px;color:#06110c}
.ln.Rapid{background:var(--t-rapid)} .ln.L{background:#c9d3ce} .ln.Local{background:var(--t-local)} .ln.SpecialRapid{background:var(--t-special)}

.board.wide .row{grid-template-columns:auto 1fr}
.board.wide .st{grid-column:2;text-align:left}
.board.wide .dest{font-size:14px;font-weight:400;color:var(--board-dim)}
.board.wide .dest b{color:var(--amber);font-family:var(--num)}
.arr,.xfer b,.xfer span{white-space:nowrap}
.board.wide .origin{margin-left:0}
.board.wide .dest{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.xfer .kan{color:var(--amber);font-weight:700;font-family:var(--num)}
body{padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html{background:var(--bg)}
</style>

}
function isHoliday(dt){
  const at=n=>{const x=new Date(dt);x.setDate(x.getDate()+n);return x}, b=x=>baseHoliday(x.getFullYear(),x.getMonth()+1,x.getDate());
  if(b(dt))return true;
  for(let i=1;i<=6;i++){const x=at(-i);if(!b(x))break;if(x.getDay()===0)return true} // 振替休日
  return b(at(-1))&&b(at(1)); // 祝日に挟まれた平日（国民の休日）
}
// 年末年始（12/30〜1/3）は例年、休日ダイヤで運転
function isNewYear(dt){const m=dt.getMonth()+1,d=dt.getDate();return (m===12&&d>=30)||(m===1&&d<=3)}

function today(){
  const cal=calendar()==='Weekday'?'wk':'hol', sd=serviceDate(), md=(sd.getMonth()+1)+'/'+sd.getDate();
  const run=x=>!(x.skip||[]).includes(md);
  // 同時刻は快速線(R)を緩行線(L)より上に並べる
  const ord=(a,b)=>a.t-b.t||(a.l===b.l?0:a.l==='R'?-1:1);
  return {up:D[cal].up.filter(run).sort(ord),dn:D[cal].dn.filter(run).sort(ord),na:D[cal].na.filter(run).sort(ord),ml:D[cal].ml.filter(run).sort((a,b)=>a.t-b.t)};
}
let animating=false;
const calm=matchMedia('(prefers-reduced-motion: reduce)');
function render(){
  $('clock').textContent=NOW().toLocaleTimeString('ja-JP',{hour12:false});
  $('mode').textContent=shift?'デモ表示':'時刻表のみ';
  if(animating)return;
  const next=buildBoards();
  const leaving=[];
  for(const el of next){
    const old=document.querySelector(`.board[data-dir="${el.dataset.dir}"]`); if(!old)continue;
    const o=[...old.querySelectorAll('.row')], n=[...el.querySelectorAll('.row')].map(x=>x.dataset.key);
    // 先頭から続けて消える列車(同時刻発の2本など)をまとめてフェードアウトさせる
    let k=0; while(k<o.length&&!n.includes(o[k].dataset.key))k++;
    if(k>0&&(k===o.length||n[0]===o[k].dataset.key))leaving.push(...o.slice(0,k));
  }
  if(!leaving.length||calm.matches){$('boards').replaceChildren(...next);return}
  animating=true;
  leaving.forEach(x=>x.classList.add('leaving'));
  setTimeout(()=>{
    const pos=new Map([...document.querySelectorAll('.row')].map(x=>[x.dataset.key,x.getBoundingClientRect()]));
    $('boards').replaceChildren(...buildBoards());
    for(const x of document.querySelectorAll('.row')){
      const a=pos.get(x.dataset.key), b=x.getBoundingClientRect();
      if(!a){x.animate([{opacity:0},{opacity:1}],{duration:650,delay:600,fill:'backwards'});continue}
      const dx=a.left-b.left, dy=a.top-b.top;
      if(dx||dy)x.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:850,easing:'cubic-bezier(.3,.6,.2,1)'});
    }
    setTimeout(()=>{animating=false},1300);
  },750);
}
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function buildBoards(){
  const now=nowMin(), T=today();
  return BOARDS.map(([dir,title])=>{
    const wide=dir==='na';
    const board=el('section','board'+(wide?' wide':''));board.dataset.dir=dir;
    board.append(el('h2','',title));
    const box=el('div','rows');
    const list=T[dir].filter(r=>r.t>=now-0.5).slice(0,wide?SHOW_NARITA:SHOW);
    if(!list.length)board.append(el('div','empty','本日の列車は終了しました'));
    for(const r of list){
      const row=el('div','row');row.dataset.key=[dir,r.t,r.l||'',r.d].join('|');
      const t=el('div','time',fmt(r.t));
      const d=el('div','dest');
      if(!wide){d.append(el('span','ln '+(r.l==='L'?'L':r.ty),TYPES[r.ty]))}
      if(wide){{const a=el('span','arr');a.append('成田 ',el('b','',fmt(r.n)),'着');d.append(a)}}else d.append(r.d);
      if(r.s)d.append(el('span','origin','当駅始発'));
      const s=el('div','st');const m=Math.max(0,Math.round(r.t-now));s.append(el('span','in',m?`あと${m}分`:'まもなく'));
      row.append(t,d,s);
      if(dir==='up'){
        const x=el('div','xfer');
        if(r.l==='L'&&r.k!=null){x.append(el('span','kan',`金町 ${fmt(r.k)}着`))}
        else if(r.m!=null){
          const c=T.ml.find(y=>y.t-r.m>=MIN_XFER);
          x.append(`松戸 ${fmt(r.m)}着 → `);
          if(c){x.append(el('span','tt-Kakueki',`各駅停車 ${c.d}行 ${fmt(c.t)}発`),' ',Object.assign(el('b','',`乗換 ${Math.round(c.t-r.m)}分`)),' → ',el('span','kan',`金町 ${fmt(c.k)}着`))}
          else x.append('本日の各駅停車への乗り換えはありません');
        }
        if(x.childNodes.length)row.append(x);
      }
      box.append(row);
    }
    board.append(box);
    return board;
  });
}
$('cal').value=cfg.cal;
$('f').addEventListener('submit',e=>{e.preventDefault();cfg.cal=$('cal').value;store.set('abikoCal',cfg.cal);render()});
$('df').addEventListener('submit',e=>{e.preventDefault();const [hh,mm]=$('demo').value.split(':').map(Number);const t=new Date();t.setHours(hh,mm,0,0);shift=t-Date.now();$('boards').replaceChildren();render()});
$('demoOff').addEventListener('click',()=>{shift=0;$('boards').replaceChildren();render()});
render();setInterval(render,1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
